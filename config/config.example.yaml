# 是否显示进度
print-progress: true

# ====== 并发配置 ======
# 新版：分阶段独立控制（推荐）
concurrent-stage:
  alive: 1000  # 存活检测并发数，处理全量节点，建议设置较高
  # speed: 100  # 测速检测并发数，只处理存活节点；若未设置，可由 network 自动推导
  media: 50   # 媒体检测并发数，只处理测速通过的节点

# 服务器测速可用带宽峰值（MB/s）
# 当未设置 concurrent-stage.speed 时，程序会基于该值自动推导测速并发
# 例如：20 表示约 20MB/s 的链路峰值
network: 20

# 检查间隔(分钟)
# 必须大于0，小于等于0会设置间隔1分钟
# check-interval: 120
# cron表达式，如果配置了此项，将忽略check-interval
# 支持标准cron表达式，如：
# "0 */2 * * *" 表示每2小时的整点执行
# "0 0 */2 * *" 表示每2天的0点执行
# "0 0 1 * *" 表示每月1日0点执行
# "*/30 * * * *" 表示每30分钟执行一次
cron-expression: "0 */6 * * *"

# === 延迟测试配置 ===
# 统一延迟模式：启用后会进行两次延迟测试，消除不同协议握手时间差异
# 第一次测试用于预热连接（完成TLS握手等），第二次测试才测量实际延迟
# 优点：更准确的延迟测量，减少因握手超时导致的误判
# 缺点：测试时间增加约50-100%
unified-delay: true
# 预热阶段超时时间（秒），用于第一次测试建立连接
warmup-timeout: 15
# 实际测试超时时间（秒），用于第二次测试测量延迟
test-timeout: 10

# 超时时间(毫秒)(节点的最大延迟)
# 注意：如果启用 unified-delay，此配置将被 warmup-timeout 和 test-timeout 替代
timeout: 10000
# 延迟测试URL
# 一些高级用法需要自己摸索，比如想要拒绝某些CF类节点，可将url替换为https://www.cloudflare.com
alive-test-url: http://gstatic.com/generate_204
# alive-test-url: http://captive.apple.com/
# 测速地址(注意 并发数*节点速度<最大网速 否则测速结果不准确)
# 尽量不要使用Speedtest，Cloudflare提供的下载链接，因为很多节点屏蔽测速网站
# 如果找不到稳定的测速地址，可以自建测速地址
# enable-speedtest: false
speed-test-url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
# speed-test-url: http://sgp.download.datapacket.com/100mb.bin
# speed-test-url: https://speed.cloudflare.com/__down?during=download&bytes=104857600
# 下载测试时间(s)(与下载链接大小相关，默认最大测试10s)
download-timeout: 10
# 单节点测速下载数据大小(MB)限制，0为不限
download-mb: 10
# 总下载速度速度限制(MB/s)，0为不限
total-speed-limit: 0

# 监听端口，用于直接返回节点信息，方便订阅转换
# http://127.0.0.1:8199/all.yaml
# 注意：为方便小白默认监听0.0.0.0:8199，请自行修改
# 更新需重启程序
listen-port: ":8199"
# 以节点IP查询位置重命名节点
# 质量差的节点可能造成IP查询失败，造成整体检查速度稍微变慢，默认true
rename-node: true
# 节点前缀，依赖rename-node为true才生效
node-prefix: ""

# 只保留指定协议的节点
node-type:
  # - ss
  # - vmess
  # - vless
# 节点国家代码过滤规则（前缀匹配）
# 在节点重命名后，匹配到的节点将被跳过，不进行测速和媒体检测
# 为空时不过滤任何节点
# 只要此项非空，程序运行时会自动将 iprisk 加入 platforms，
# 以确保能拿到 Country / IPRisk 信息用于过滤
# 示例：
#   - "CN": 过滤所有中国节点（CN, CN_极佳, CN_良好 等）
#   - "HK": 过滤所有香港节点
filters:
  - "CN"

# 是否开启流媒体检测，其中IP欺诈依赖重命名
media-check: true
platforms:
  - gemini
  - openai
# platforms:
#   - iprisk
#   - tiktok
#   - youtube
#   - netflix
#   - disney
#   - openai
#   - gemini

# 输出目录
# 如果为空，则为程序所在目录的config目录
output-dir: ""

# 是否启用Web控制面板
# 如果为false，则不启动Web控制界面，仅启动订阅服务相关接口
# 访问地址：http://127.0.0.1:8199/admin
enable-web-ui: true
# 填写Web控制面板的api-key，如果为空，则自动生成
# 配置文件为空时，支持使用环境变量设置 API_KEY
api-key: "123456"

# 填写搭建的apprise API server 地址
# https://notify.xxxx.us.kg/notify
apprise-api-server: ""
# 填写通知目标
# 支持100+ 个通知渠道，详细格式请参照 https://github.com/caronc/apprise
recipient-url:
  # telegram格式：tgram://{bot_token}/{chat_id}
  # - tgram://xxxxxx/-1002149239223
  # 钉钉格式：dingtalk://{Secret}@{ApiKey}
  # - dingtalk://xxxxxx@xxxxxxx
# 自定义通知标题
notify-title: "🔔 节点状态更新"

# 重试次数(获取订阅失败后重试次数)
sub-urls-retry: 1
# 重试间隔(秒)
sub-urls-retry-interval: 2
# 订阅链接超时时间(秒)
sub-urls-timeout: 60
# 订阅代理(订阅解析服务)
# 当直连获取订阅失败后，会依次尝试使用这些代理服务获取订阅
# 多项配置可提高容错性，任一代理成功即返回
# 格式：代理地址 + 原始订阅URL(自动进行URL编码)
sub-urls-proxy:
  - http://13.210.164.168:8080/sub?token=hAL_JGQjkCS9LLE^!LK4vF*3q11GeG$c&url=
#   - https://api.wcc.best/sub?target=clash&scv=true&url=
#   - https://sub.xeton.dev/sub?target=clash&scv=true&url=
#   - https://sub.ops.ci/sub?target=clash&scv=true&url=
# 订阅链接失败重试次数
# 控制订阅链接获取失败后的处理策略：
# > 0: 启用智能重试机制，失败N次后才删除订阅链接（推荐：3-5）
# = 0: 失败1次就立即删除订阅链接
# < 0: 永不删除失败的订阅链接（默认：-1）
# 注意：删除操作会保留配置文件中的注释和格式
sub-urls-retry-failed: 3
# 最低节点数量阈值（节点类型过滤后统计）
# 当订阅解析后的有效节点数量低于此值时，将该订阅记录为失败
# 设置为 0 表示不启用此检查（默认）
# 注意：此检查在节点类型过滤（node-type）之后、去重之前执行
sub-urls-min-node-count: 0
# 获取订阅时使用的UA；如果设置random将会使用随机UA获取订阅
# sub-urls-get-ua: "random"
sub-urls-get-ua: "clash-meta"

# Github Proxy，获取订阅使用，结尾要带的 /
github-proxy: "https://ghfast.top/"
# 此参数更通用，适用于拉取代理、消息推送、文件上传等等
# 写法跟环境变量一样。修改需重启生效
# proxy: "http://username:password@192.168.1.1:7890"
# proxy: "socks5://username:password@192.168.1.1:7890"
proxy: ""
# 远程订阅清单地址;用于集中维护多个订阅链接，避免频繁修改本地文件
# 支持两种格式：
# 1) 纯文本：按行分隔，支持 # 注释与空行
# 2) YAML/JSON：字符串数组 ["https://...", "https://..."]
# 支持时间占位符与 github-proxy，例如包含 {Ymd}、{Y-m-d}
sub-urls-remote:
  # - https://example.com/sub-list.txt
  # - https://example.com/sub-list.yaml
  # - https://raw.githubusercontent.com/beck-8/sub-urls/main/%E5%B0%8F%E8%80%8C%E7%BE%8E.txt

# 订阅地址 支持 clash/mihomo/v2ray/base64 格式的订阅链接
# 如果用户想明确使用clash类型，那可以在支持的订阅链接结尾加上 &flag=clash.meta
# github 链接可自己添加ghproxy使用；订阅链接支持 HTTP_PROXY HTTPS_PROXY 环境变量加速拉取
# 如果用户想区分节点来源，可在订阅链接结尾加上 #备注 ，备注字段会自动加到节点命名结尾
sub-urls:
  # - https://example.com/sub.txt
  # - https://example.com/sub2.txt
  # - https://example.com/sub?token=43fa8f0dc9bb00dcfec2afb21b14378a
  # - https://example.com/sub?token=43fa8f0dc9bb00dcfec2afb21b14378a?flag=clash.meta
  # - https://raw.githubusercontent.com/example/repo/main/config/{Ymd}.yaml
  # - https://raw.githubusercontent.com/example/repo/main/daily/daily-{Y}-{m}-{d}.yaml
  # - https://example.com/sub.txt#我是备注我是备注
  # 打开这个就可以把上次可用的节点再次测一次
  - http://127.0.0.1:8199/sub/all.yaml
